name: Daily EOD US Stock Screener Data Update (Supabase Cloud DB)

on:
  schedule:
    # Runs Monday through Friday at 21:30 UTC (after US Market Close)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger anytime in GitHub Actions tab

jobs:
  update-eod-snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch EOD US Universe & Push Directly to Supabase Online DB
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -m src.data_pipeline
